<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoctrIA</title>
    <link rel="stylesheet" href="estilos/style.css">
    <script src="https://kit.fontawesome.com/2ddaec0f4b.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div id="tittle">
            <h1>Noctech</h1>
            <p>Estude menos. Entenda mais.</p>
        </div>
        <div id="header-buttons">
            <a href="#">Início</a>
            <a href="#">Resumos</a>
            <button id="theme">Tema</button>
            <a href="#">Sobre</a>
        </div>
    </header>

    <menu id="settings">
        <a href="#"><i class="fa-solid fa-sliders"></i> Dashboard</a>
        <a href="#" data-mode="resumo"><i class="fa-regular fa-file"></i>Criar resumo</a>
        <a href="#" data-mode="quiz"><i class="fa-solid fa-puzzle-piece"></i>Gerar quiz</a>
        <a href="#"><i class="fa-solid fa-book"></i> Meus estudos</a>
        <a href="#"><i class="fa-solid fa-gear"></i> Configurações</a>
    </menu>

    <main id="container">
        <div id="text">
            <h2>Estude de forma mais inteligente.</h2>
            <p>Insira seu conteúdo abaixo e deixe a Noctech transformar suas informações em conhecimento.</p>
        </div>
        <div id="input">
            <form id="form">
                <textarea id="itext" name="text" placeholder="Cole aqui o conteúdo da sua matéria..."
                    required></textarea>

                <button type="submit" id="ibutton">
                    Criar resumo
                </button>
            </form>
        </div>

        <div id="result" aria-live="polite"></div>
    </main>

    <script src="scripts/theme.js"></script>
    <script src="scripts/app.js"></script>
</body>

</html>
