<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoctrIA</title>
    <link rel="stylesheet" href="estilos/style.css">
    <script src="https://kit.fontawesome.com/2ddaec0f4b.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div id="tittle">
            <h1>Noctech</h1>
            <p>Estude menos. Entenda mais.</p>
        </div>
        <div id="header-buttons">
            <a href="#">Início</a>
            <a href="#">Resumos</a>
            <a href="#">Quizzes</a>
            <a href="#">Sobre</a>
        </div>
    </header>

    <menu id="settings">
        <a href="#"><i class="fa-solid fa-sliders"></i> Dashboard</a>
        <a href="#"><i class="fa-regular fa-file"></i> Criar resumo</a>
        <a href="#"><i class="fa-solid fa-puzzle-piece"></i> Gerar quiz</a>
        <a href="#"><i class="fa-solid fa-book"></i> Meus estudos</a>
        <a href="#"><i class="fa-solid fa-gear"></i> Configurações</a>
    </menu>

    <main id="container">
        <div id="text">
            <h2>Estude de forma mais inteligente.</h2>
            <p>Insira seu conteúdo abaixo e deixe a Noctech transformar suas informações em conhecimento.</p>
        </div>
        <div id="input">
            <form id="form">
                <input type="text" name="text" id="itext" placeholder="Insira seu conteúdo">
                <input type="submit" value="Gerar" id="ibutton">
            </form>
        </div>
    </main>
</body>
</html>
